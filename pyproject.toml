[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orchesjob"
version = "1.0.2.dev1"
description = "Lightweight idempotent one-shot job runner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ryosuke Muraki", email = "ryosuke@mrk.jp" }
]
keywords = ["job", "runner", "idempotent", "scheduler", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rmuraki/orchesjob"
Repository = "https://github.com/rmuraki/orchesjob"
"Bug Tracker" = "https://github.com/rmuraki/orchesjob/issues"

[project.scripts]
orchesjob = "orchesjob.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = [
  "build>=1.0",
  "twine>=5.0",
  "pytest>=8",
]
